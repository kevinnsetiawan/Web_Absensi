<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
</head>

<body class="bg-light">

    <div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
        <div class="row shadow-lg rounded-4 overflow-hidden" style="max-width: 900; background-color: white;">

            <!-- KIRI -->
            <div class="col-md-6 text-center text-white d-flex flex-column justify-content-center p-5"
                style="background: linear-gradient(to bottom right, #729ad8, #4f78c8);">
                <h5 class="fw-bold mb-5">SMP GIKI 2 Surabaya</h5>
                <div class="mb-4">
                    <i class="bi bi-journal-text" style="font-size: 3rem;"></i>
                </div>
                <h6 class="fw-semibold mb-4">ABSENSI SISWA</h6>
                <div>
                    <button class="btn btn-light text-primary fw-semibold mb-2 w-50">LOGIN</button><br>
                    <button class="btn btn-outline-light w-50">SIGN UP</button>
                </div>
            </div>

            <!-- KANAN -->
            <div class="col-md-6 bg-light d-flex flex-column justify-content-center p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-house-door" style="font-size: 3rem; color: #4f78c8;"></i>
                    <h4 class="fw-bold mt-2 text-primary">LOGIN</h4>
                </div>

                <form onsubmit="handleLogin(event)">
                    <div class="mb-3 input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" placeholder="Username" required>
                    </div>

                    <div class="mb-3 input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" placeholder="Password" required>
                    </div>

                    <div class="mb-3">
                        <select class="form-select" required>
                            <option selected disabled>Pilih</option>
                            <option>Siswa</option>
                            <option>Guru</option>
                            <option>Tata Usaha</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <input type="checkbox" id="remember">
                            <label for="remember" class="ms-1">Remember me</label>
                        </div>
                        <a href="#" class="small text-decoration-none text-primary">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-3">Login</button>
                </form>
            </div>

        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const username = event.target.querySelector('input[type="text"]').value;
            const password = event.target.querySelector('input[type="password"]').value;
            const role = event.target.querySelector('select').value;
            
            // Validasi sederhana
            if (!username || !password || !role) {
                alert('Mohon lengkapi semua field');
                return;
            }
            
            // Simulasi login (dalam aplikasi nyata, ini akan dikirim ke server)
            if (username === 'admin' && password === 'admin') {
                // Simpan data login ke localStorage
                localStorage.setItem('userLogin', JSON.stringify({
                    username: username,
                    role: role,
                    loginTime: new Date().toISOString()
                }));
                
                // Redirect ke dashboard sesuai role
                if (role === 'Guru') {
                    window.location.href = 'dashboard-guru.html';
                } else if (role === 'Tata Usaha') {
                    window.location.href = 'dashboard-tata-usaha.html';
                } else if (role === 'Siswa') {
                    window.location.href = 'dashboard-siswa.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } else {
                alert('Username atau password salah');
            }
        }
        
        // Cek apakah user sudah login
        document.addEventListener('DOMContentLoaded', function() {
            const userLogin = localStorage.getItem('userLogin');
            if (userLogin) {
                // Jika sudah login, redirect ke dashboard
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>

</html>
